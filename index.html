<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>n3lame — official</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070709;
      color: #f4f4f6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background-image: radial-gradient(circle at 50% 0%, #1a1026 0%, #070709 65%);
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(18, 18, 24, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
    }
    .cover {
      width: 150px;
      height: 150px;
      border-radius: 14px;
      object-fit: cover;
      margin: 0 auto 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: lowercase;
      margin-bottom: 4px;
    }
    .sub {
      font-size: 13px;
      color: #8e8e9e;
      margin-bottom: 22px;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #c4a7ff;
      background: rgba(196, 167, 255, 0.12);
      border: 1px solid rgba(196, 167, 255, 0.25);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    a.btn {
      display: block;
      text-decoration: none;
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      transition: 0.2s ease;
    }
    a.btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }
    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 18px 0;
    }
    .socials {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 13px;
    }
    .socials a {
      color: #a0a0b2;
      text-decoration: none;
      transition: 0.2s;
    }
    .socials a:hover { color: #fff; }
    .contact {
      margin-top: 18px;
      font-size: 12px;
      color: #6b6b7b;
    }
    .contact a { color: #9a9ab0; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">

    <div class="links">

</body>
</html>
