<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>n3lame</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080808;
      color: #ededed;
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px 64px;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      width: 100%;
      max-width: 440px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 18px;
      padding-bottom: 24px;
      border-bottom: 1px solid #1e1e1e;
      margin-bottom: 28px;
    }

    .cover {
      width: 84px;
      height: 84px;
      object-fit: cover;
      border: 1px solid #2a2a2a;
      flex-shrink: 0;
      filter: contrast(1.05);
    }

    .title-block h1 {
      font-family: 'Inter', sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .release-tag {
      font-size: 12px;
      color: #777;
    }

    .release-tag span {
      color: #ededed;
    }

    .section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #5c5c5c;
      margin-bottom: 10px;
    }

    .list {
      display: flex;
      flex-direction: column;
      border-top: 1px solid #1e1e1e;
      margin-bottom: 28px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 10px;
      border-bottom: 1px solid #1e1e1e;
      color: #ededed;
      text-decoration: none;
      font-size: 13px;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .row:hover {
      background: #ededed;
      color: #080808;
    }

    .row .arrow {
      font-size: 12px;
      color: #5c5c5c;
      transition: color 0.12s ease, transform 0.12s ease;
    }

    .row:hover .arrow {
      color: #080808;
      transform: translate(2px, -2px);
    }

    .footer {
      padding-top: 8px;
      font-size: 12px;
      color: #666;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .footer-line {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer a, .mail-btn {
      color: #ededed;
      text-decoration: none;
      border-bottom: 1px solid #333;
      padding-bottom: 1px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .footer a:hover, .mail-btn:hover {
      border-color: #ededed;
    }

    .copied {
      font-size: 11px;
      color: #888;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .copied.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="header">
      <img src="cover.png" alt="n3lame — mastermind" class="cover" />
      <div class="title-block">
        <h1>n3lame</h1>
        <div class="release-tag">new single: <span>mastermind</span></div>
      </div>
    </header>

    <div class="section-label">Слушать меня на всех площадках</div>
    <nav class="list">
      <a class="row" href="https://music.yandex.ru/artist/27001615" target="_blank" rel="noopener">
        <span>Yandex Music</span>
        <span class="arrow">↗</span>
      </a>
      <a class="row" href="https://soundcloud.com/n3lame" target="_blank" rel="noopener">
        <span>SoundCloud</span>
        <span class="arrow">↗</span>
      </a>
      <a class="row" href="https://vk.ru/n3lame" target="_blank" rel="noopener">
        <span>VK Music</span>
        <span class="arrow">↗</span>
      </a>
      <a class="row" href="https://open.spotify.com/artist/3nOzX3m8mmxCSk6kvA9DJM" target="_blank" rel="noopener">
        <span>Spotify</span>
        <span class="arrow">↗</span>
      </a>
      <a class="row" href="https://www.youtube.com/@n3lame_music" target="_blank" rel="noopener">
        <span>YouTube Music</span>
        <span class="arrow">↗</span>
      </a>
      <a class="row" href="https://genius.com/artists/N3lame" target="_blank" rel="noopener">
        <span>Genius</span>
        <span class="arrow">↗</span>
      </a>
    </nav>

    <div class="section-label">Соцсети</div>
    <nav class="list">
      <a class="row" href="https://t.me/n3lame" target="_blank" rel="noopener">
        <span>Telegram</span>
        <span class="arrow">↗</span>
      </a>
      <a class="row" href="https://vk.ru/n3lame" target="_blank" rel="noopener">
        <span>VK Паблик</span>
        <span class="arrow">↗</span>
      </a>
      <a class="row" href="https://www.tiktok.com/@n3lame" target="_blank" rel="noopener">
        <span>TikTok</span>
        <span class="arrow">↗</span>
      </a>
    </nav>

    <footer class="footer">
      <div class="footer-line">
        <span>DM —</span>
        <a href="https://t.me" target="_blank" rel="noopener">@n3lamee</a>
      </div>
      <div class="footer-line">
        <span>Contact:</span>
        <span class="mail-btn" id="mailCopy">n3lame@gmail.com</span>
        <span class="copied" id="copiedMsg">[ скопировано ]</span>
      </div>
    </footer>
  </main>

  <script>
    const mailBtn = document.getElementById('mailCopy');
    const copiedMsg = document.getElementById('copiedMsg');
    mailBtn.addEventListener('click', () => {
      navigator.clipboard.writeText('n3lame@gmail.com');
      copiedMsg.classList.add('show');
      setTimeout(() => copiedMsg.classList.remove('show'), 1800);
    });
  </script>
</body>
</html>
